name: Weekly Check

on:
  schedule:
    # 每周一 UTC 03:17 跑一次，避开整点拥堵
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# 周检只保留最新一轮，手动补跑也不和定时任务叠在一起
concurrency:
  group: weekly-check
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: 零依赖环境自检
        run: |
          node --version
          node -e "const p=require('./package.json'); if (p.dependencies || p.devDependencies) { console.error('本项目不许有 npm 依赖'); process.exit(1); }"

      # Ubuntu 镜像有 Chrome，必须真跑浏览器关；macOS 缺浏览器时允许按闸门原逻辑跳过。
      - name: 统一质量闸门
        run: npm run check ${{ matrix.os == 'ubuntu-latest' && '-- --require-browser' || '' }}
