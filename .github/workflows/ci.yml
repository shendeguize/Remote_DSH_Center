name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 跑测试不需要写任何东西（失败截图用 upload-artifact，也只要读权限）
permissions:
  contents: read

# 同一分支上新推一次就掐掉旧的跑，别排队
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 校验 PR 标题
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|test|chore|refactor|ci)(\([a-z0-9-]+\))?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR 标题必须匹配：$pattern"
            exit 1
          fi

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 下载并核验 actionlint 1.7.12
        run: |
          set -euo pipefail
          archive='actionlint_1.7.12_linux_amd64.tar.gz'
          archive_path="$RUNNER_TEMP/$archive"
          tool_dir="$RUNNER_TEMP/actionlint-1.7.12"
          expected_sha256='8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'

          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive_path" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive"
          if ! printf '%s  %s\n' "$expected_sha256" "$archive_path" | sha256sum --check -; then
            echo "::error::actionlint 1.7.12 压缩包 SHA-256 与官方发布值不符"
            exit 1
          fi

          # 摘要核验成功后才创建目录、解包和执行；只从归档中提取 actionlint 这一项。
          mkdir "$tool_dir"
          tar -xzf "$archive_path" -C "$tool_dir" -- actionlint
          test -x "$tool_dir/actionlint"
          "$tool_dir/actionlint" -version
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: 检查工作流语法与表达式
        run: |
          set -euo pipefail
          shopt -s nullglob
          workflow_files=(.github/workflows/*.yml .github/workflows/*.yaml)
          if (( ${#workflow_files[@]} == 0 )); then
            echo "::error::没有找到 .github/workflows 下的 .yml 或 .yaml 工作流"
            exit 1
          fi
          actionlint "${workflow_files[@]}"

  check:
    # 平台分工（成本管控）：同一套闸门跑两个平台再乘以「PR 一次 + 合入 main 又一次」，
    # 等于每个 PR 跑四遍，其中最贵的 macOS 跑两遍（私有仓计费时 mac 是 10 倍单价）。
    #
    #   pull_request      → ubuntu：镜像自带 Chrome，真浏览器关只有这儿能真跑，且最便宜
    #   push（合入 main） → macOS：launchd / dshc service 是 mac 语义，产品也只发 mac
    #   workflow_dispatch → 两个都跑：合入前想手动确认双平台时用
    #
    # 兜底不在这里：tag 上的 release.yml 会在 arm64 与 intel 两台真 mac 上解包实跑，
    # 任何 mac 侧问题在出 Release 之前必然被拦住。
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || (github.event_name == 'push' && fromJSON('["macos-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          # 零 npm 依赖，没有 lockfile 可缓存，也不需要 npm ci

      - name: 环境自检
        run: |
          node --version
          node -e "const p=require('./package.json'); if (p.dependencies || p.devDependencies) { console.error('本项目不许有 npm 依赖'); process.exit(1); }"

      # Ubuntu 镜像自带 Chrome，那边就要求浏览器关必须真跑；
      # macOS runner 不一定装浏览器，缺了就让它跳过而不是把 CI 判红。
      - name: 统一质量闸门（测试 + 覆盖率 + 真浏览器 + 站点文档 + 打包 + CLI）
        run: npm run check ${{ matrix.os == 'ubuntu-latest' && '-- --require-browser' || '' }}

      - name: 失败时留下浏览器截图
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-shots-${{ matrix.os }}
          path: |
            .local/tmp/ui-smoke/
            .local/tmp/site-check/
          if-no-files-found: ignore
          retention-days: 7

  # plugin/ 子包是零依赖底线的唯一例外（独立 npm 包，依赖与构建链封闭在 plugin/ 内），
  # 走自己的 lane；不动上面的 check job 与零依赖自检（例外边界闸门在 tests/ 里补位）。
  # 不进 required checks：required 名单与 ruleset 强耦合有用例钉死，稳定一个里程碑后再议。
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: 插件自测（typecheck + 测试 + 构建 + 打包清单）
        working-directory: plugin
        run: npm ci && npm run verify
