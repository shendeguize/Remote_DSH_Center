name: Release

on:
  push:
    tags: ['v*']

# 默认只读；建 Release 要写 contents，就在这一处显式给
permissions:
  contents: read

# build（守卫 + 闸门 + 组装双架构产物）→ verify（两种 mac 上真跑一遍），之后
# 两条车道并行：release（挂附件建 GitHub Release）与 publish → npm-smoke（发
# npm 包，再真从 registry 装回来冒烟）。GitHub Release 不依赖 npm 发布成败——
# standalone 通道的行为与产物不因 npm 车道而变。
#
# 为什么要拆：产物必须在**两种 CPU 架构的真机**上跑过才配挂到 Release 上——
# 「x64 包在 arm 机上打完就发」这种事，装的人才是第一个发现的。verify 不过就不建
# Release，不留半个发版。
#
# 为什么 build 在 ubuntu：打包只是下载官方 Node 的 darwin tarball 再重新装箱，
# 不需要 mac；mac runner 贵且慢，留给 verify 用。
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.guard.outputs.version }}
      prerelease: ${{ steps.guard.outputs.prerelease }}

    steps:
      # 守卫三要判「tag 提交是否包含于 main」，得有完整历史
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: 采集分支事实
        id: facts
        run: |
          git fetch --quiet origin main release
          echo "tag_sha=$(git rev-parse "$GITHUB_REF")" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse origin/release)" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$GITHUB_REF" origin/main; then
            echo "in_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "in_main=false" >> "$GITHUB_OUTPUT"
          fi

      # 三守卫：版本号一致 / CHANGELOG 小节非空 / tag 出自 main（正式版还要求正在
      # release HEAD）。顺带把 version 与 prerelease 吐进 step outputs，
      # 「什么是预发布」的判定只有 semver 那一份，不在 shell 里再猜一次。
      - name: 发版守卫
        id: guard
        run: |
          node scripts/release-guard.mjs \
            --tag "$GITHUB_REF_NAME" \
            --tag-sha "${{ steps.facts.outputs.tag_sha }}" \
            --release-sha "${{ steps.facts.outputs.release_sha }}" \
            --in-main "${{ steps.facts.outputs.in_main }}" \
            --body-out "$RUNNER_TEMP/release-body.md" \
            --vars-out "$GITHUB_OUTPUT"

      # tag 可能打在错的提交上，这一遍不省
      - name: 统一质量闸门
        run: npm run check -- --require-browser

      - name: 组装双架构发布包
        run: node scripts/build-bundle.mjs --out dist

      - name: 产物清单
        run: |
          ls -lh dist/
          cat dist/SHA256SUMS

      - name: 上传产物给下游 job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles
          path: dist/
          if-no-files-found: error
          retention-days: 7

      # Release 正文来自 CHANGELOG，由守卫截好；release job 不重新 checkout 也能拿到
      - name: 上传 Release 正文
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-body.md
          if-no-files-found: error
          retention-days: 7

      - name: 失败时留下浏览器截图
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-browser-shots
          path: |
            .local/tmp/ui-smoke/
            .local/tmp/site-check/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13（Intel）已于 2025-12 退役，macos-15-intel 是唯一在售的 Intel
          # 托管镜像（供应至 2027-08）
          - runner: macos-latest
            arch: arm64
            uname: arm64
          - runner: macos-15-intel
            arch: x64
            uname: x86_64

    steps:
      # 只用来跑下面那段断言脚本；被验的产物一律用它自带的 node 跑
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles
          path: dist

      # 镜像的架构要是哪天悄悄变了，下面那些断言会「在 arm 上验 arm 包」两遍，
      # 看着全绿其实一半没验过——所以先把跑在什么机器上钉死
      - name: 核对 runner 架构
        run: |
          actual="$(uname -m)"
          if [ "$actual" != "${{ matrix.uname }}" ]; then
            echo "::error::期望 ${{ matrix.uname }} 的 runner，实际是 $actual——镜像换架构了，矩阵得改"
            exit 1
          fi
          echo "runner 架构 $actual（验 ${{ matrix.arch }} 包）"

      - name: 核对校验和
        working-directory: dist
        run: shasum -a 256 -c SHA256SUMS

      - name: 解包
        run: |
          tar -xzf "dist/dsh-center-v${{ needs.build.outputs.version }}-darwin-${{ matrix.arch }}.tar.gz"
          ls -l "dsh-center-v${{ needs.build.outputs.version }}-darwin-${{ matrix.arch }}"

      # 关键断言：装进 PATH 的是**软链**，且执行时用的必须是**包内**那个 node。
      # `env -i` 把环境清空（PATH 只留 /usr/bin:/bin）——runner 上的系统 node 就此不可见，
      # 所以这一步能跑通，等于证明了「没装 node 的机器上也能跑」。
      - name: 经软链 + 自带运行时跑起来
        run: |
          bundle="$PWD/dsh-center-v${{ needs.build.outputs.version }}-darwin-${{ matrix.arch }}"
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf "$bundle/bin/dshc" "$RUNNER_TEMP/bin/dshc"

          env -i PATH=/usr/bin:/bin HOME="$HOME" "$RUNNER_TEMP/bin/dshc" --help | head -3
          env -i PATH=/usr/bin:/bin HOME="$HOME" \
            DSHC_HOME="$RUNNER_TEMP/dshc-home" \
            "$RUNNER_TEMP/bin/dshc" version --json > "$RUNNER_TEMP/version.json"
          cat "$RUNNER_TEMP/version.json"

          # 以下 ${...} 是 JavaScript 模板字面量；单引号特意阻止 shell 展开
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const info = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const want = { version: process.argv[2], arch: process.argv[3], bundle: process.argv[4] };
            const problems = [];
            if (info.version !== want.version) problems.push(`版本 ${info.version} != ${want.version}`);
            if (info.channel !== "bundle") problems.push(`通道 ${info.channel} != bundle`);
            if (info.bundle?.arch !== want.arch) problems.push(`架构 ${info.bundle?.arch} != ${want.arch}`);
            if (!info.node.execPath.startsWith(want.bundle)) {
              problems.push(`用的不是包内运行时：${info.node.execPath}`);
            }
            if (problems.length > 0) {
              console.error(`::error::冒烟断言未过：${problems.join("；")}`);
              process.exit(1);
            }
            console.log(`✔ v${info.version} ${info.bundle.arch}，运行时 Node ${info.node.version}（包内）`);
          ' "$RUNNER_TEMP/version.json" \
            "${{ needs.build.outputs.version }}" "${{ matrix.arch }}" "$bundle"

      # 包里那份 install.mjs 也得能在没有系统 node 的机器上跑起来——它是卸载与
      # 服务化的唯一入口，漏进白名单的话装完才发现
      - name: 包内安装器可用（同样不借系统 node）
        run: |
          bundle="$PWD/dsh-center-v${{ needs.build.outputs.version }}-darwin-${{ matrix.arch }}"
          env -i PATH=/usr/bin:/bin HOME="$HOME" \
            "$bundle/runtime/bin/node" "$bundle/app/scripts/install.mjs" \
            --prefix "$RUNNER_TEMP/probe-bin"
          test -L "$RUNNER_TEMP/probe-bin/dshc"
          test "$(readlink "$RUNNER_TEMP/probe-bin/dshc")" = "$bundle/bin/dshc"

  release:
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: notes

      - name: 为发布产物生成构建溯源证明
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: 建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # 这个 job 故意不 checkout（只需要上游的 artifact），所以 gh 没法从 .git 推断
          # 仓库——必须显式告诉它是哪个仓库，否则连 --verify-tag 都会去跑 git 然后报
          # 「not a git repository」
          GH_REPO: ${{ github.repository }}
          # tag 带预发布后缀时挂 --prerelease，判定来自守卫（semver 那一份口径）
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          args=(--title "$GITHUB_REF_NAME" --notes-file notes/release-body.md --verify-tag)
          if [ "$PRERELEASE" = 'true' ]; then
            args+=(--prerelease)
            echo "预发布通道：Release 会标 Pre-release，不动 latest 指针"
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" \
            dist/*.tar.gz dist/SHA256SUMS

      - name: 附件核对
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release view "$GITHUB_REF_NAME" --json isPrerelease,assets

  # 发布认证双路径（与 plugin-publish.yml 同款，ADR-9）：npm 侧配置了 Trusted
  # Publishing 时 OIDC 生效（免长期 token）；未配置时回落仓库 secret NPM_TOKEN
  # （经 setup-node 的 registry-url 机制注入 ~/.npmrc）。两条路产物都带
  # provenance，均为 npm CLI 原生能力，不需要第三方 action。主体与插件共用
  # 同一 NPM_TOKEN secret。
  publish:
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # npm Trusted Publishing / provenance

    steps:
      # 发布只需要 tag 那份源码（打包白名单在 package.json 的 files 里），默认深度即可
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # NPM_TOKEN 缺席时该 env 为空，setup-node 生成的 ~/.npmrc 拿不到凭据，
      # npm CLI 转而尝试 OIDC（Trusted Publishing）——两路自然互斥，无需分支。
      # rc 发到 next dist-tag、不动 latest；预发布判定只用守卫吐的那一份，
      # 不在 shell 里再猜一次 semver。
      - name: 发布到 npm（provenance；OIDC 或 NPM_TOKEN）
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          args=(--provenance --access public --ignore-scripts)
          if [ "$PRERELEASE" = 'true' ]; then
            args+=(--tag next)
            echo "预发布通道：发到 next dist-tag，不动 latest 指针"
          fi
          npm publish "${args[@]}"

  # 发后安装冒烟：真从 registry 装回来跑 dshc version --json，自证 npm 通道
  npm-smoke:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # registry 传播有延迟：装不上不等于没发上，循环重试后仍装不上才红
      - name: 从 registry 装回来（≤10 次、每次隔 30s）
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for attempt in $(seq 1 10); do
            if npm i -g "dsh-center@$VERSION"; then
              echo "第 $attempt 次尝试装上 dsh-center@$VERSION"
              exit 0
            fi
            echo "registry 还没有 dsh-center@$VERSION（第 $attempt/10 次），30s 后再试"
            sleep 30
          done
          echo "::error::重试 10 次仍装不到 dsh-center@$VERSION——发布没生效或传播异常"
          exit 1

      - name: 冒烟断言：dshc version --json 自证 npm 通道
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          dshc version --json > "$RUNNER_TEMP/version.json"
          cat "$RUNNER_TEMP/version.json"

          # 以下 ${...} 是 JavaScript 模板字面量；单引号特意阻止 shell 展开
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const info = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const problems = [];
            if (info.version !== process.argv[2]) problems.push(`版本 ${info.version} != ${process.argv[2]}`);
            if (info.channel !== "npm") problems.push(`通道 ${info.channel} != npm`);
            if (problems.length > 0) {
              console.error(`::error::npm 冒烟断言未过：${problems.join("；")}`);
              process.exit(1);
            }
            console.log(`✔ npm 通道 v${info.version}`);
          ' "$RUNNER_TEMP/version.json" "$VERSION"
