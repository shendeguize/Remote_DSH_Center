<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mock dsh web</title>
<style>
  /*
   * demo 里被 iframe 嵌进管理台的假页面。真实环境这里是远端 dsh web 本体
   * （经 ssh -L 映射到 http://127.0.0.1:<本机端口>/）。
   * 它刻意长得不像管理台：让人一眼看出「壳」与「被嵌的应用」是两个东西。
   */
  :root {
    color-scheme: dark;
    --bg: #10131a;
    --panel: #171b24;
    --line: #262c38;
    --fg: #d7dce5;
    --dim: #8b93a3;
    --accent: #6ee7a8;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.6 var(--mono);
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .title { font-weight: 600; }
  .badge {
    margin-left: auto;
    font-size: 11px;
    color: var(--dim);
    border: 1px dashed var(--line);
    border-radius: 999px;
    padding: 2px 10px;
  }
  main { flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  .term {
    flex: 1;
    min-height: 180px;
    background: #0c0f15;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    white-space: pre-wrap;
    overflow: auto;
  }
  .term .p { color: var(--accent); }
  .term .d { color: var(--dim); }
  .cursor { animation: blink 1.1s steps(2, start) infinite; }
  @keyframes blink { to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  .keep {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    background: var(--panel);
  }
  .keep label { display: block; color: var(--dim); font-size: 11px; margin-bottom: 6px; }
  .keep input {
    width: 100%;
    background: #0c0f15;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--fg);
    font: inherit;
    padding: 7px 9px;
  }
  .keep p { margin: 8px 0 0; color: var(--dim); font-size: 11px; }
  footer { padding: 8px 14px; border-top: 1px solid var(--line); color: var(--dim); font-size: 11px; }
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <span class="title">dsh web</span>
  <span class="d" id="conn">127.0.0.1</span>
  <span class="badge">demo 内嵌页 —— 真实场景此处是远端 dsh web 本体</span>
</header>

<main>
  <div class="term" id="term"></div>

  <div class="keep">
    <label for="draft">试试在这里打字，然后切到管理台标签再切回来</label>
    <input id="draft" type="text" placeholder="内容会留着 —— 这就是 keep-alive：切标签只改显隐，不重载 iframe">
    <p id="keepNote">切标签不会清空；但「进程崩溃后重启」会重载页面，这里就会被清空。</p>
  </div>
</main>

<footer id="foot"></footer>

<script type="module">
  const params = new URLSearchParams(location.search);
  const host = params.get('host') ?? 'unknown-host';
  const port = params.get('port') ?? '—';

  document.title = `dsh web — ${host}`;
  document.getElementById('conn').textContent = `http://127.0.0.1:${port}/`;
  document.getElementById('foot').textContent =
    `session ${Math.random().toString(36).slice(2, 8)} · 载入于 ${new Date().toLocaleTimeString('zh-CN', { hour12: false })} · ${host}`;

  const LINES = [
    ['p', `dsh@${host}`, ' harness v0.1.0-rc.7 · profile: web'],
    ['d', '', 'workspace /root/work/train · 7 plugins loaded'],
    ['p', 'dsh> ', 'status'],
    ['d', '', '  runtime   ready (cuda 12.4, 8×A100-80G)'],
    ['d', '', '  dataset   pile-mini · 4.2M rows'],
    ['d', '', '  ckpt      step-14200 (2026-08-20 22:14)'],
    ['p', 'dsh> ', 'eval --suite quick'],
    ['d', '', '  [1/4] tokenize .......... ok  1.8s'],
    ['d', '', '  [2/4] forward ........... ok  6.2s'],
    ['d', '', '  [3/4] score ............. ok  2.1s'],
    ['d', '', '  [4/4] report ............ ok  0.4s'],
    ['d', '', '  quick score 0.8143 (+0.0021)'],
    ['p', 'dsh> ', ''],
  ];

  const term = document.getElementById('term');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function renderLine([kind, prompt, body]) {
    const div = document.createElement('div');
    if (prompt) {
      const s = document.createElement('span');
      s.className = 'p';
      s.textContent = prompt;
      div.append(s);
    }
    const b = document.createElement('span');
    b.className = kind === 'd' ? 'd' : '';
    b.textContent = body;
    div.append(b);
    term.append(div);
    term.scrollTop = term.scrollHeight;
    return div;
  }

  if (reduced) {
    for (const line of LINES) renderLine(line);
    const c = document.createElement('span');
    c.className = 'cursor';
    c.textContent = '▌';
    term.lastElementChild?.append(c);
  } else {
    // 打字机：一行一行冒出来，让「这是个活着的进程」有点说服力
    let i = 0;
    const tick = () => {
      if (i >= LINES.length) {
        const c = document.createElement('span');
        c.className = 'cursor';
        c.textContent = '▌';
        term.lastElementChild?.append(c);
        return;
      }
      renderLine(LINES[i]);
      i += 1;
      setTimeout(tick, 120 + Math.random() * 110);
    };
    tick();
  }
</script>
</body>
</html>
